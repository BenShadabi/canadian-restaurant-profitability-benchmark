name: checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Rebuild everything from the CSVs
        run: |
          python analysis/build_charts.py
          python analysis/build_scenarios.py
          python analysis/build_dashboard.py
          python sql/run_queries.py
      - name: Check every headline number
        run: python checks.py
      - name: Fail if the rebuilt tables or pages differ from what is committed
        run: git diff --exit-code -- docs/dashboard.html sql/results.md data/*.csv
